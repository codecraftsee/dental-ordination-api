# Tool configuration only. This project is an application, not an installable
# package, so there is deliberately no [project] table or build backend.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes — unused imports, undefined names
    "I",   # isort — import ordering
    "B",   # flake8-bugbear — likely bugs
    "UP",  # pyupgrade — modern syntax for the pinned Python 3.12
]

ignore = [
    # Rewrites `class UserRole(str, Enum)` into `StrEnum`. That is a behaviour
    # change, not a modernisation: str() and f-strings give "UserRole.ADMIN" for
    # a (str, Enum) member and "ADMIN" for a StrEnum one. These enums reach the
    # API through Pydantic and the database through SQLAlchemy, so the two are
    # not interchangeable. Nothing stringifies them bare today, which is exactly
    # why the change would pass the suite and surface later.
    "UP042",
    # PEP 695 `def get_or_404[ModelT](...)` instead of an explicit TypeVar.
    # Valid on 3.12, has no autofix, and is a style preference not a cleanup.
    "UP047",
]

[tool.ruff.lint.flake8-bugbear]
# B008 warns that a function call in an argument default is evaluated once, at
# import. For FastAPI that is not a bug, it is the entire dependency-injection
# mechanism — `Depends(...)`, `Query(...)` and friends are *meant* to be
# evaluated once and inspected by the framework. Without this list B008 fires
# nine times on correct code, which is how a linter gets ignored.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "app.dependencies.require_permission",
]

# Pre-production stack: FastAPI behind Caddy with automatic HTTPS.
#
# Server:
#   cd /opt/dental/app
#   docker compose --env-file /opt/dental/.env up -d --build
#
# Local smoke test (see deploy/README.md):
#   ENV_FILE=.env.docker docker compose --env-file .env.docker up -d --build

services:
  api:
    build: .
    # Tagged with the commit it was built from, so previous builds stay on disk
    # and a rollback is `IMAGE_TAG=<sha> docker compose up -d --no-build` rather
    # than a git reset plus a full rebuild. deploy-api.sh exports this.
    # The `preprod` fallback keeps a bare `docker compose up` from failing
    # outright, but it is not a safe default: it starts whatever was last built
    # untagged, so a hand-run restart without IMAGE_TAG silently serves stale
    # code while looking healthy. Always pass the tag — see deploy/README.md,
    # "Restarting by hand".
    image: dental-api:${IMAGE_TAG:-preprod}
    restart: unless-stopped
    # Real env vars, injected at runtime. pydantic-settings gives these priority
    # over any .env file, and .dockerignore keeps .env out of the image entirely.
    env_file:
      - ${ENV_FILE:-/opt/dental/.env}
    # `expose`, not `ports` — deliberately unreachable from the host. Publishing
    # 8000 would expose the API over plaintext HTTP on the server's IP,
    # bypassing TLS. Only Caddy, on the shared network, can reach it.
    expose:
      - "8000"
    # Container stdout goes to the systemd journal rather than Docker's default
    # per-container json-file. Every deploy runs `up -d --build`, which recreates
    # the container, and a json-file log is deleted along with the container it
    # belonged to — so log history never reached back past the last deploy. The
    # journal lives outside Docker and survives recreation; journald's
    # SystemMaxUse (set to 1G on the server) is what bounds the disk it can take.
    #
    # Read it back with the container name, which Compose derives from the
    # project directory and so is stable across deploys — that stability is the
    # point, it is what lets one query span builds:
    #   journalctl CONTAINER_NAME=app-api-1 -f
    #   journalctl CONTAINER_NAME=app-api-1 --since "1 hour ago"
    # Requires membership of the `systemd-journal` group; without it the daemon's
    # messages are invisible and the query returns nothing rather than an error.
    #
    # Env-driven because Docker Desktop's Linux VM has no systemd, so `journald`
    # cannot work on a Mac: the server sets LOG_DRIVER=journald in
    # /opt/dental/.env and the local smoke test falls through to json-file.
    # Deliberately no `options:` — the two drivers accept different option names
    # (`max-size` is json-file only, `tag` is not), so anything set here would
    # break whichever driver it was not written for.
    logging:
      driver: ${LOG_DRIVER:-json-file}
    networks:
      - dental

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"     # required for the Let's Encrypt HTTP-01 challenge
      - "443:443"
      - "443:443/udp"
    environment:
      API_HOST: ${API_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WWW_DIR:-/opt/dental/www}:/srv/www:ro
      # Named volumes so issued certificates survive `docker compose down`.
      # Losing these means re-requesting certs and burning Let's Encrypt quota.
      - caddy_data:/data
      - caddy_config:/config
    # Same reasoning as the api service above.
    #   journalctl CONTAINER_NAME=app-caddy-1 -f
    logging:
      driver: ${LOG_DRIVER:-json-file}
    depends_on:
      - api
    networks:
      - dental

volumes:
  caddy_data:
  caddy_config:

networks:
  dental:
